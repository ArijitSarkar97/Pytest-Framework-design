  <style type="text/tailwindcss">
    @layer utilities {
      .glass-panel {
        @apply bg-slate-900/40 backdrop-blur-xl border border-white/5 shadow-xl;
      }
      
      .glass-input {
        @apply bg-slate-900/50 border border-white/10 focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 text-slate-100 placeholder:text-slate-500 transition-all duration-300;
      }

        @apply drop-shadow-[0_0_10px_rgba(255,255,255,0.3)];
      }
      
      .btn-glow {
        @apply relative overflow-hidden transition-all duration-300 hover:shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:scale-[1.02];
      }
      
      .terminal-text {
        @apply font-mono text-cyan-400 drop-shadow-[0_0_5px_rgba(34,211,238,0.3)];
      }
    }
